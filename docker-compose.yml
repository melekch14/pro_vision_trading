version: '3.8'

services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    # ❌ REMOVE port exposure to the internet
    # ports:
    #   - "3306:3306"
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    # ❗ Bind phpMyAdmin to localhost ONLY (not to the whole world)
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - internal
    depends_on:
      - mysql

  backend:
    build:
      context: ./back
    restart: always
    env_file:
      - ./back/.env
    ports:
      - "3080:3080"  # public API (ok)
    depends_on:
      - mysql
    networks:
      - internal
      - public

  frontend:
    build:
      context: ./front
    restart: always
    ports:
      - "4200:80"  # public site (ok)
    depends_on:
      - backend
    networks:
      - public

networks:
  internal:
    internal: true  # 🔒 hidden network (mysql + phpMyAdmin + backend)
  public: {}         # 🌍 public network (frontend + backend)

volumes:
  mysql_data:
