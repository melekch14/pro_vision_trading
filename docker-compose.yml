version: '3.8'

services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - internal
    depends_on:
      - mysql

  backend:
    build:
      context: ./back
    restart: always
    env_file:
      - ./back/.env
    ports:
      - "3080:3080"
    depends_on:
      - mysql
    networks:
      - internal
      - public

  frontend:
    image: nginx:latest
    restart: always
    ports:
      - "4200:80"
    networks:
      - public

networks:
  internal:
    internal: true
  public: {}

volumes:
  mysql_data:
