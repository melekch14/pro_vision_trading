services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: op
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"                 # MySQL exposed to the world (VPS IP)
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"                   # 🌍 now publicly accessible on VPS_IP:8080
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./back
    restart: always
    env_file:
      - ./back/.env
    ports:
      - "3080:3080"                 # 🌍 public API
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
      - public

  frontend:
    build:
      context: ./front
    restart: always
    ports:
      - "4200:80"                   # 🌍 public frontend
    depends_on:
      - backend
    networks:
      - public

networks:
  internal:
    internal: true                  # 🔒 hidden (mysql, phpMyAdmin, backend)
  public: {}                         # 🌍 exposed (frontend, backend)

volumes:
  mysql_data:
