# docker-compose.yml
services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: op
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"   # optional if you want to connect remotely
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"      # 🔥 public access
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./back
    restart: always
    env_file:
      - ./back/.env
    ports:
      - "3080:3080"   # public API
    networks:
      - internal
      - public
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "./wait-for-it.sh mysql:3306 --timeout=60 --strict -- node server.js"

  frontend:
    build:
      context: ./front
    restart: always
    ports:
      - "4200:80"
    networks:
      - public
    depends_on:
      - backend

networks:
  internal:
    internal: true
  public: {}

volumes:
  mysql_data:
