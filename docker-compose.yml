# docker-compose.yml
services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: op
      MYSQL_USER: app_user
      # Keep this aligned with backend .env (DB_USER=app_user, DB_PASSWORD=root)
      MYSQL_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Bind to all interfaces so remote clients can reach MySQL via the host.
      # SECURITY: consider restricting to a trusted IP (e.g. "203.0.113.10:3306:3306") or using a VPN.
      - "0.0.0.0:3306:3306"   # optional if you want to connect remotely
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      # Bind to all interfaces so phpMyAdmin is reachable remotely via the host.
      # SECURITY: consider restricting to a trusted IP (e.g. "203.0.113.10:8080:80") or using a VPN.
      - "0.0.0.0:8080:80"
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./back
    restart: always
    env_file:
      - ./back/.env
    environment:
      # Use root only for DB bootstrap (CREATE DATABASE). Normal app queries can still use DB_USER from .env.
      DB_ADMIN_USER: root
      DB_ADMIN_PASS: root
    ports:
      - "0.0.0.0:3080:3080"   # public API
    networks:
      - internal
      - public
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./front
    restart: always
    ports:
      - "0.0.0.0:4200:80"
    networks:
      - public
    depends_on:
      - backend

networks:
  internal:
    internal: true
  public: {}

volumes:
  mysql_data:
