<div class="stock-dialog">
  <h2 mat-dialog-title>Gestion du stock - {{data.article.libelle}}</h2>

  <mat-dialog-content>
    <div class="filter-row" style="display: flex; gap: 16px; align-items: center; margin-bottom: 16px; justify-content: center;">
      <label>Filtrer Sphère :
        <select [(ngModel)]="filterSphere">
          <option [ngValue]="null">Toutes</option>
          <option *ngFor="let s of sphereValues" [ngValue]="s">{{s}}</option>
        </select>
      </label>
      <label>Filtrer Cylindre :
        <select [(ngModel)]="filterCylindre">
          <option [ngValue]="null">Tous</option>
          <option *ngFor="let c of cylindreValues" [ngValue]="c">{{c}}</option>
        </select>
      </label>
    </div>
    <div class="stock-grid">
      <table>
        <thead>
          <tr>
            <th></th>
            <th *ngFor="let sphere of filteredSphereValues" class="sphere-header">
              {{sphere}}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cylindre of filteredCylindreValues">
            <td class="cylindre-header">{{cylindre}}</td>
            <td *ngFor="let sphere of filteredSphereValues"
                class="quantity-cell"
                [class.has-stock]="hasExistingStock(sphere, cylindre)"
                [class.non-zero]="hasNonZeroValue(sphere, cylindre)">
              <input type="number"
                     min="0"
                     [ngModel]="getQuantity(sphere, cylindre)"
                     (ngModelChange)="onQuantityChange(sphere, cylindre, $event)"
                     class="quantity-input">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Annuler</button>
    <button mat-raised-button color="primary" (click)="onSave()">Enregistrer</button>
  </mat-dialog-actions>
</div>
