<div class="supplementary-price-dialog">
  <h2 mat-dialog-title>Gestion des prix suppléments - {{data.article.libelle}}</h2>

  <mat-dialog-content>
    <div class="controls-row">
      <div class="filter-row">
        <label>Filtrer Sphère :
          <select [(ngModel)]="filterSphere">
            <option [ngValue]="null">Toutes</option>
            <option *ngFor="let s of sphereValues" [ngValue]="s">{{s}}</option>
          </select>
        </label>
        <label>Filtrer Cylindre :
          <select [(ngModel)]="filterCylindre">
            <option [ngValue]="null">Tous</option>
            <option *ngFor="let c of cylindreValues" [ngValue]="c">{{c}}</option>
          </select>
        </label>
      </div>
      
      <div class="bulk-actions">
        <div class="selection-status" *ngIf="isSelecting">
          <span class="material-icons">drag_indicator</span>
          Mode sélection active - Glissez pour sélectionner
        </div>
        <div class="bulk-input">
          <label>Prix en lot :</label>
          <input type="number" 
                 min="0" 
                 step="0.01" 
                 [(ngModel)]="bulkPrice" 
                 placeholder="0.00"
                 class="price-input">
          <button mat-raised-button 
                  color="primary" 
                  (click)="applyBulkPrice()"
                  [disabled]="selectedCells.size === 0 || bulkPrice <= 0">
            Appliquer ({{selectedCells.size}})
          </button>
        </div>
        <button mat-button (click)="clearSelection()">Effacer sélection</button>
      </div>
    </div>



    <div class="price-grid">
      <table (dragstart)="$event.preventDefault()">
        <thead>
          <tr>
            <th></th>
            <th *ngFor="let cylindre of filteredCylindreValues" class="cylindre-header">
              {{cylindre}}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sphere of filteredSphereValues">
            <td class="sphere-header">{{sphere}}</td>
            <td *ngFor="let cylindre of filteredCylindreValues"
                class="price-cell"
                [class.has-stock]="hasStock(sphere, cylindre)"
                [class.has-price]="hasNonZeroPrice(sphere, cylindre)"
                [class.selected]="isCellSelected(sphere, cylindre)"
                [class.selecting]="isSelecting"
                [class.no-stock]="!hasStock(sphere, cylindre)"
                (mousedown)="onCellMouseDown(sphere, cylindre, $event)"
                (mouseenter)="onCellMouseEnter(sphere, cylindre, $event)"
                (mouseup)="onCellMouseUp()">
              <div *ngIf="hasStock(sphere, cylindre)" class="price-content">
                <input type="number"
                       min="0"
                       step="0.01"
                       [ngModel]="getPrice(sphere, cylindre)"
                       (ngModelChange)="onPriceChange(sphere, cylindre, $event)"
                       class="price-input"
                       (click)="$event.stopPropagation()">
              </div>
              <div *ngIf="!hasStock(sphere, cylindre)" class="no-stock-indicator">
                Pas de stock
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Annuler</button>
    <button mat-raised-button color="primary" (click)="onSave()">Enregistrer</button>
  </mat-dialog-actions>
</div>
