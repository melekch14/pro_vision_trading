<div class="article-params-bg">
  <h1 class="main-title">Article Parameters Management</h1>

  <!-- Tabs -->
  <div class="tabs">
    <button 
      *ngFor="let type of ['foyers', 'indices', 'designs', 'couleur-photos', 'traitements']"
      [class.active]="activePanel === type" 
      class="tab-btn" 
      (click)="setPanel(type)">
      {{type | titlecase}}
    </button>
  </div>

  <ng-container *ngFor="let type of ['foyers', 'indices', 'designs', 'couleur-photos', 'traitements']">
    <div *ngIf="activePanel === type" class="panel-container">
      <!-- Add Parameter Form (left card) -->
      <div class="card form-card">
        <h2 class="section-title">Add New {{type | titlecase}}</h2>
        <form [formGroup]="paramForms[type]" (ngSubmit)="onSubmit(type)" class="param-form">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Name:</label>
              <input type="text" id="name" formControlName="name" class="form-control" placeholder="Enter name">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full-width">
              <label for="description">Description:</label>
              <textarea id="description" formControlName="description" class="form-control" placeholder="Enter description"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" [disabled]="!paramForms[type].valid" class="save-btn">Add {{type | titlecase}}</button>
          </div>
        </form>
      </div>

      <!-- Parameters List with Filter Above Table (right card) -->
      <div class="card params-card">
        <div class="params-header">
          <h2 class="section-title">{{type | titlecase}}s</h2>
          <span class="params-count">{{params[type].length}} items found</span>
        </div>
        <form [formGroup]="filterForms[type]" class="filter-form-table">
          <div class="filter-row">
            <input type="text" id="search" formControlName="search" class="form-control" placeholder="Search by name...">
            <button type="button" class="filter-btn" (click)="applyFilter(type)">
              <span class="icon-search"></span> Filter
            </button>
            <button type="button" class="reset-btn" (click)="resetFilter(type)">Reset</button>
          </div>
        </form>
        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let param of filteredParams[type]">
              <td><b>{{param.name}}</b></td>
              <td>{{param.description}}</td>
              <td>
                <button (click)="deleteParam(type, param.id)" class="delete-btn">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </ng-container>
</div>
