<div class="form-container">
  <h3>Modifier le client</h3>
  <form *ngIf="customerForm" [formGroup]="customerForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="codee">Code</label>
        <input type="text" class="form-control" id="codee" formControlName="codee" readonly>
        <div *ngIf="customerForm.get('codee')?.invalid && (customerForm.get('codee')?.dirty || customerForm.get('codee')?.touched)" class="validation-error">
          Code est requis
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <label for="raison_social">Raison Sociale</label>
        <input type="text" class="form-control" id="raison_social" formControlName="raison_social">
        <div *ngIf="customerForm.get('raison_social')?.invalid && (customerForm.get('raison_social')?.dirty || customerForm.get('raison_social')?.touched)" class="validation-error">
          Raison Sociale est requise
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <label for="adresse">Adresse</label>
        <input type="text" class="form-control" id="adresse" formControlName="adresse">
        <div *ngIf="customerForm.get('adresse')?.invalid && (customerForm.get('adresse')?.dirty || customerForm.get('adresse')?.touched)" class="validation-error">
          Adresse est requise
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="tel">Téléphone</label>
        <input type="text" class="form-control" id="tel" formControlName="tel">
        <div *ngIf="customerForm.get('tel')?.invalid && (customerForm.get('tel')?.dirty || customerForm.get('tel')?.touched)" class="validation-error">
          Téléphone est requis
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" formControlName="email">
        <div *ngIf="customerForm.get('email')?.invalid && (customerForm.get('email')?.dirty || customerForm.get('email')?.touched)" class="validation-error">
          <div *ngIf="customerForm.get('email')?.errors?.['required']">L'email est requis</div>
          <div *ngIf="customerForm.get('email')?.errors?.['email']">Veuillez entrer un email valide</div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <label for="responsable">Responsable</label>
        <input type="text" class="form-control" id="responsable" formControlName="responsable">
        <div *ngIf="customerForm.get('responsable')?.invalid && (customerForm.get('responsable')?.dirty || customerForm.get('responsable')?.touched)" class="validation-error">
          Responsable est requis
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="status">Statut</label>
        <select class="form-control" id="status" formControlName="status">
          <option *ngFor="let status of customerStatuses" [value]="status">{{ status | titlecase }}</option>
        </select>
        <div *ngIf="customerForm.get('status')?.invalid && (customerForm.get('status')?.dirty || customerForm.get('status')?.touched)" class="validation-error">
          Statut est requis
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <label for="rccm">RCCM</label>
        <input type="text" class="form-control" id="rccm" formControlName="rccm">
        <div *ngIf="customerForm.get('rccm')?.invalid && (customerForm.get('rccm')?.dirty || customerForm.get('rccm')?.touched)" class="validation-error">
          RCCM est requis
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <label for="ninea">NINEA</label>
        <input type="text" class="form-control" id="ninea" formControlName="ninea">
        <div *ngIf="customerForm.get('ninea')?.invalid && (customerForm.get('ninea')?.dirty || customerForm.get('ninea')?.touched)" class="validation-error">
          NINEA est requis
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="code_douane">Code Douane</label>
        <input type="text" class="form-control" id="code_douane" formControlName="code_douane">
        <div *ngIf="customerForm.get('code_douane')?.invalid && (customerForm.get('code_douane')?.dirty || customerForm.get('code_douane')?.touched)" class="validation-error">
          Code Douane est requis
        </div>
      </div>
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-primary mr-2" [disabled]="customerForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        Mettre à jour Client
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancelFormAction()" [disabled]="isLoading">Annuler</button>
    </div>
  </form>
</div>
