<div class="page-container">
  <div class="header-row">
    <h1 class="page-title">{{ formTitle }}</h1>
  </div>
  
  <div class="form-container">
    <div class="form-header">
      <h2>{{ formTitle }}</h2>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #customerForm="ngForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="codee">Code</label>
          <input
            type="text"
            id="codee"
            name="codee"
            [(ngModel)]="customer.codee"
            required
            #codee="ngModel"
          />
          <div *ngIf="codee.invalid && (codee.dirty || codee.touched)" class="validation-error">
            Code is required
          </div>
        </div>

        <div class="form-group">
          <label for="raison_social">Raison Social</label>
          <input
            type="text"
            id="raison_social"
            name="raison_social"
            [(ngModel)]="customer.raison_social"
            required
            #raison_social="ngModel"
          />
          <div *ngIf="raison_social.invalid && (raison_social.dirty || raison_social.touched)" class="validation-error">
            Raison Social is required
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="customer.email"
            required
            email
            #email="ngModel"
          />
          <div *ngIf="email.invalid && (email.dirty || email.touched)" class="validation-error">
            <div *ngIf="email.errors?.['required']">Email is required</div>
            <div *ngIf="email.errors?.['email']">Please enter a valid email</div>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="customer.password"
            required
            minlength="6"
            #password="ngModel"
          />
          <div *ngIf="password.invalid && (password.dirty || password.touched)" class="validation-error">
            <div *ngIf="password.errors?.['required']">Password is required</div>
            <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</div>
          </div>
        </div>

        <div class="form-group">
          <label for="responsable">Responsable</label>
          <input
            type="text"
            id="responsable"
            name="responsable"
            [(ngModel)]="customer.responsable"
            required
            #responsable="ngModel"
          />
          <div *ngIf="responsable.invalid && (responsable.dirty || responsable.touched)" class="validation-error">
            Responsable is required
          </div>
        </div>

        <div class="form-group">
          <label for="tel">Tel</label>
          <input
            type="tel"
            id="tel"
            name="tel"
            [(ngModel)]="customer.tel"
            required
            #tel="ngModel"
          />
          <div *ngIf="tel.invalid && (tel.dirty || tel.touched)" class="validation-error">
            Tel is required
          </div>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select
            id="status"
            name="status"
            [(ngModel)]="customer.status"
            required
            #status="ngModel"
          >
            <option *ngFor="let status of customerStatuses" [value]="status">
              {{ status | titlecase }}
            </option>
          </select>
          <div *ngIf="status.invalid && (status.dirty || status.touched)" class="validation-error">
            Status is required
          </div>
        </div>

        <div class="form-group full-width">
          <label for="adresse">Adresse</label>
          <textarea
            id="adresse"
            name="adresse"
            [(ngModel)]="customer.adresse"
            required
            rows="3"
            #adresse="ngModel"
          ></textarea>
          <div *ngIf="adresse.invalid && (adresse.dirty || adresse.touched)" class="validation-error">
            Adresse is required
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="cancel()" [disabled]="isLoading">
          Cancel
        </button>
        <button type="submit" class="submit-btn" [disabled]="customerForm.invalid || isLoading">
          <span *ngIf="isLoading" class="spinner"></span>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>
