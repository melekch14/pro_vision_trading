<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="forgot-password-header">
      <img src="assets/logo.png" alt="OpticianCare" class="forgot-password-logo">
    </div>

    <div class="forgot-password-title">Mot de passe oublié</div>
    <div class="forgot-password-subtitle">Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe</div>

    <form #forgotPasswordForm="ngForm" (ngSubmit)="onSubmit(forgotPasswordForm)" novalidate *ngIf="!message">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          class="form-control"
          [ngClass]="{'is-invalid': (emailInput.invalid && (emailInput.dirty || emailInput.touched)) || (submitted && emailInput.invalid)}"
          placeholder="Entrez votre adresse email"
        >
        <div *ngIf="(emailInput.invalid && (emailInput.dirty || emailInput.touched)) || (submitted && emailInput.invalid)" class="error-message">
          <div *ngIf="emailInput.errors?.['required']">L'email est requis</div>
          <div *ngIf="emailInput.errors?.['pattern']">Veuillez entrer une adresse email valide</div>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div class="form-actions">
        <button type="submit" class="reset-button" [disabled]="loading">
          <span *ngIf="loading">Envoi...</span>
          <span *ngIf="!loading">Envoyer le lien de réinitialisation</span>
        </button>
      </div>

      <div class="auth-links">
        <a (click)="backToLogin()" class="auth-link back-link">Retour à la connexion</a>
      </div>
    </form>

    <div *ngIf="message" class="success-message">
      <div class="message-content">
        {{ message }}
      </div>
      <div class="auth-links">
        <a (click)="backToLogin()" class="auth-link back-link">Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>
