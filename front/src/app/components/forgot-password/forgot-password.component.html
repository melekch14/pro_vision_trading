<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="forgot-password-header">
      <img src="assets/logo.png" alt="OpticianCare" class="forgot-password-logo">
    </div>
    
    <div class="forgot-password-title">Forgot Password</div>
    <div class="forgot-password-subtitle">Enter your email address and we'll send you a link to reset your password</div>
    
    <form #forgotPasswordForm="ngForm" (ngSubmit)="onSubmit(forgotPasswordForm)" novalidate *ngIf="!message">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          class="form-control"
          [ngClass]="{'is-invalid': (emailInput.invalid && (emailInput.dirty || emailInput.touched)) || (submitted && emailInput.invalid)}"
          placeholder="Enter your email address"
        >
        <div *ngIf="(emailInput.invalid && (emailInput.dirty || emailInput.touched)) || (submitted && emailInput.invalid)" class="error-message">
          <div *ngIf="emailInput.errors?.['required']">Email is required</div>
          <div *ngIf="emailInput.errors?.['pattern']">Please enter a valid email address</div>
        </div>
      </div>
      
      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>
      
      <div class="form-actions">
        <button type="submit" class="reset-button" [disabled]="loading">
          <span *ngIf="loading">Sending...</span>
          <span *ngIf="!loading">Send Reset Link</span>
        </button>
      </div>
      
      <div class="auth-links">
        <a (click)="backToLogin()" class="auth-link back-link">Back to Login</a>
      </div>
    </form>
    
    <div *ngIf="message" class="success-message">
      <div class="message-content">
        {{ message }}
      </div>
      <div class="auth-links">
        <a (click)="backToLogin()" class="auth-link back-link">Back to Login</a>
      </div>
    </div>
  </div>
</div>
