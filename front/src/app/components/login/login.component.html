<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/logo.png" alt="OpticianCare" class="login-logo">
    </div>

    <div class="login-title">Bon retour</div>
    <div class="login-subtitle">Veuillez entrer vos identifiants pour vous connecter</div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="user.email"
          #email="ngModel"
          required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          class="form-control"
          [ngClass]="{'is-invalid': (email.invalid && (email.dirty || email.touched)) || (submitted && email.invalid)}"
          placeholder="Entrez votre email"
        >
        <div *ngIf="(email.invalid && (email.dirty || email.touched)) || (submitted && email.invalid)" class="error-message">
          <div *ngIf="email.errors?.['required']">L'email est requis</div>
          <div *ngIf="email.errors?.['pattern']">Veuillez entrer une adresse email valide</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="user.password"
          #password="ngModel"
          required
          minlength="6"
          class="form-control"
          [ngClass]="{'is-invalid': (password.invalid && (password.dirty || password.touched)) || (submitted && password.invalid)}"
          placeholder="Entrez votre mot de passe"
        >
        <div *ngIf="(password.invalid && (password.dirty || password.touched)) || (submitted && password.invalid)" class="error-message">
          <div *ngIf="password.errors?.['required']">Le mot de passe est requis</div>
          <div *ngIf="password.errors?.['minlength']">Le mot de passe doit comporter au moins 6 caractères</div>
        </div>
        <div class="forgot-password">
          <a routerLink="/forgot-password" class="auth-link">Mot de passe oublié ?</a>
        </div>
      </div>

      <div *ngIf="loginError" class="alert alert-danger">
        {{ loginError }}
      </div>

      <div class="form-actions">
        <button type="submit" class="login-button">Se connecter</button>
      </div>

      <div class="auth-links">
        Vous n'avez pas de compte ? <a routerLink="/register" class="auth-link">Inscrivez-vous</a>
      </div>
    </form>
  </div>
</div>
