<aside class="sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">
  <!-- Mobile Toggle Button -->
  <button class="mobile-toggle" (click)="toggleMobile()" *ngIf="isMobileView">
    <span class="material-icons">{{ isMobileOpen ? 'close' : 'menu' }}</span>
  </button>
  
  <!-- Desktop Toggle Button -->
  <button class="desktop-toggle" (click)="toggleCollapse()" *ngIf="!isMobileView">
    <span class="material-icons">{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</span>
  </button>
  
  <div class="sidebar-header">
    <div class="logo">
      <img src="assets/logo.png" alt="Pro Vision Trading" class="logo-image">
    </div>
  </div>
  
  <nav class="sidebar-nav">
    <ul class="nav-list list-unstyled">
      <ng-container *ngFor="let item of menuItems">
        <li *ngIf="hasAccess(item.id)" class="nav-item">
          <a [routerLink]="item.route" routerLinkActive="active" class="nav-link" (click)="onNavClick()">
            <span class="nav-icon material-icons">{{item.icon}}</span>
            <span class="nav-title">{{item.name}}</span>
          </a>
        </li>
      </ng-container>
    </ul>
  </nav>
  
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="avatar">
        <img *ngIf="getUserAvatar()" [src]="getUserAvatar()" alt="Avatar" class="avatar-img">
        <span *ngIf="!getUserAvatar()" class="initials">{{getInitials()}}</span>
      </div>
      <div class="user-info">
        <p class="user-name">{{getUserName()}}</p>
        <p class="user-role">{{getUserRole()}}</p>
      </div>
      <button class="logout-button" (click)="logout()" mat-icon-button>
        <span class="material-icons">logout</span>
      </button>
    </div>
  </div>
</aside>

<!-- Mobile Overlay -->
<div class="sidebar-overlay" *ngIf="isMobileOpen" (click)="closeMobile()"></div>
