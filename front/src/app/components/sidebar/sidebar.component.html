<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <img src="assets/logo.png" alt="Pro Vision Trading" class="logo-image">
    </div>
  </div>
  
  <nav class="sidebar-nav">
    <ul class="nav-list list-unstyled">
      <li *ngFor="let item of menuItems" class="nav-item">
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-link">
          <span class="nav-icon material-icons">{{item.icon}}</span>
          <span class="nav-title">{{item.title}}</span>
        </a>
      </li>
    </ul>
  </nav>
  
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="avatar">
        <span class="initials">AL</span>
      </div>
      <div class="user-info">
        <p class="user-name">Anis laarousi</p>
        <p class="user-role">Admin</p>
      </div>
    </div>
  </div>
</aside>
